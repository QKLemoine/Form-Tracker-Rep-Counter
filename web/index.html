<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111418" />
    <title>Form Trainer</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <main>
      <h1>Form Trainer</h1>
      <div id="stage" class="stage" hidden>
        <video id="video" playsinline muted></video>
        <canvas id="overlay"></canvas>
        <div class="hud">
          <div class="panels">
            <div class="panel" data-side="left">
              <div class="panel-name">Left</div>
              <div class="reps"><span id="reps-left">0</span> <span class="unit">reps</span></div>
              <div class="match">last rep <span id="match-left">–</span></div>
            </div>
            <div class="panel" data-side="right">
              <div class="panel-name">Right</div>
              <div class="reps"><span id="reps-right">0</span> <span class="unit">reps</span></div>
              <div class="match">last rep <span id="match-right">–</span></div>
            </div>
          </div>
          <div class="bars">
            <div class="bar" data-side="left"><span class="bar-name">L</span><div class="bar-track"><div id="bar-left" class="bar-fill"></div></div></div>
            <div class="bar" data-side="right"><span class="bar-name">R</span><div class="bar-track"><div id="bar-right" class="bar-fill"></div></div></div>
          </div>
        </div>
      </div>
      <p id="status" class="status" role="status">Tap Start to turn on the camera. Video stays on this device.</p>
      <div class="controls">
        <button id="start" type="button">Start camera</button>
        <select id="exercise" aria-label="Exercise"></select>
        <button id="record" type="button" disabled>Record golden rep</button>
        <button id="flip" type="button" disabled>Flip camera</button>
      </div>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
